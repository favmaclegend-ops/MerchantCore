<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>You're offline · Merchant Core</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        height: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 12px 40px rgba(15, 23, 42, 0.06);
      }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        border-radius: 20px;
        background: linear-gradient(135deg, #0d9488, #0f766e);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg {
        width: 36px;
        height: 36px;
        stroke: #ffffff;
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 10px;
        letter-spacing: -0.01em;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #64748b;
        margin-bottom: 28px;
      }
      button {
        width: 100%;
        padding: 12px 16px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        color: #ffffff;
        background: #0f172a;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: opacity 0.2s ease, transform 0.1s ease;
      }
      button:hover { opacity: 0.92; }
      button:active { transform: scale(0.98); }
      button:disabled { opacity: 0.6; cursor: default; }
      .hint {
        margin-top: 16px;
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="card" role="status" aria-live="polite">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12h2l3-7 4 14 3-9 2 4h6" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p id="msg">No internet connection detected. Please reconnect to continue using Merchant Core.</p>
      <button id="retry" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
        </svg>
        Try again
      </button>
      <div class="hint">Merchant Core</div>
    </div>

    <script>
      (function () {
        var retry = document.getElementById("retry");
        var msg = document.getElementById("msg");
        var checking = false;

        function render() {
          if (navigator.onLine) {
            // Back online: leave the offline page.
            window.location.replace("/");
            return;
          }
          msg.textContent = "No internet connection detected. Please reconnect to continue using Merchant Core.";
          retry.disabled = false;
          retry.lastChild.textContent = "Try again";
          checking = false;
        }

        retry.addEventListener("click", function () {
          if (checking) return;
          checking = true;
          retry.disabled = true;
          msg.textContent = "Checking your connection…";
          retry.lastChild.textContent = "Checking…";

          if (navigator.onLine) {
            window.location.replace("/");
            return;
          }

          // Try a tiny network request to confirm reconnection.
          fetch("/manifest.json", { cache: "no-store" })
            .then(function (r) { window.location.replace("/"); })
            .catch(function () {
              setTimeout(render, 600);
            });

          // Fallback: re-evaluate if we come back online within a few seconds.
          setTimeout(function () {
            if (!checking) return;
            render();
          }, 4000);
        });

        window.addEventListener("online", function () {
          window.location.replace("/");
        });
        window.addEventListener("offline", render);

        render();
      })();
    </script>
  </body>
</html>
