<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content, maximum-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Apply the stored theme before first paint so the iOS status bar /
      // toolbar area starts with the correct header colour (no stuck flash).
      (function () {
        try {
          var theme = localStorage.getItem('app_theme') === 'dark' ? 'dark' : 'light';
          var header = theme === 'dark' ? '#0f172a' : '#ffffff';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.createElement('meta');
          meta.name = 'theme-color';
          meta.content = header;
          document.head.appendChild(meta);
        } catch (e) { /* ignore */ }
      })();
    </script>
    <title>MerchantCore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
